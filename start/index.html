<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --sage: #8BA89A;
    --sage-dark: #6E8E7E;
    --sage-deeper: #4A6E5E;
    --charcoal: #2C2C2C;
    --off-white: #FAFAF8;
    --warm-sage: #EEF2EF;
    --border: #DDE6E1;
    --body-text: #4A4A4A;
    --muted: #7A8A80;
    --faint: #B0BDB5;
  }

  html { font-size: 16px; }

  body {
    font-family: 'Karla', Arial, sans-serif;
    background: var(--off-white);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    color: var(--charcoal);
    -webkit-font-smoothing: antialiased;
    padding: 0 0 40px;
  }

  .wrap {
    width: 100%;
    max-width: 420px;
  }

  .hero-photo {
    width: 100%;
    aspect-ratio: 16 / 7;
    overflow: hidden;
    position: relative;
    margin-bottom: 28px;
  }

  .hero-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .hero-photo::after {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(to bottom, rgba(44,44,44,0.05), rgba(44,44,44,0.35));
  }

  .hero-photo .credit {
    position: absolute; bottom: 8px; right: 10px;
    font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 0.5px; text-transform: uppercase;
    color: rgba(255,255,255,0.75); font-weight: 600;
  }

  .content { padding: 0 20px; }

  header {
    text-align: center;
    margin-bottom: 32px;
  }

  header img {
    height: 34px;
    width: auto;
    margin: 0 auto 16px;
    display: block;
  }

  .tagline {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.5;
    max-width: 300px;
    margin: 0 auto;
  }

  .actions {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .action {
    display: block;
    background: #FFFFFF;
    border: 1px solid var(--border);
    padding: 20px 22px;
    text-decoration: none;
    transition: transform 0.15s, border-color 0.15s, background 0.15s;
  }

  .action:active {
    transform: scale(0.98);
  }

  .action-label {
    display: block;
    font-family: 'Karla', sans-serif;
    font-weight: 700;
    font-size: 17px;
    color: var(--charcoal);
    margin-bottom: 4px;
  }

  .action-sub {
    display: block;
    font-size: 13.5px;
    color: var(--muted);
    line-height: 1.4;
  }

  .action.primary {
    background: var(--sage-deeper);
    border-color: var(--sage-deeper);
  }

  .action.primary .action-label { color: #FFFFFF; }
  .action.primary .action-sub { color: rgba(255,255,255,0.7); }

  .action:hover { border-color: var(--charcoal); }
  .action.primary:hover { background: var(--sage-dark); border-color: var(--sage-dark); }

  .action.call {
    background: var(--warm-sage);
    border-color: var(--border);
  }

  .action.call .action-label { color: var(--sage-deeper); }

  footer {
    text-align: center;
    margin-top: 48px;
  }

  .footer-name {
    font-family: 'Karla', sans-serif;
    font-weight: 700;
    font-size: 14px;
    color: var(--charcoal);
    margin-bottom: 6px;
  }

  footer a {
    font-size: 13px;
    color: var(--muted);
    text-decoration: none;
  }

  footer a:hover { color: var(--sage-deeper); }

  @media (max-width: 380px) {
    .content { padding: 0 16px; }
    .action { padding: 18px 18px; }
  }
</style>
</head>
<body>

  <div class="wrap">

    <div class="hero-photo">
      <img src="../images/work/coda-construction-01.jpg" alt="Kitchen remodel by Coda Construction, a RemodelerRank client">
      <span class="credit">Coda Construction</span>
    </div>

    <div class="content">

      <header>
        <img src="../images/logo.svg" alt="RemodelerRank" width="200" height="35">
        <p class="tagline">Over 20 years in construction. Marketing for businesses that build things.</p>
      </header>

      <div class="actions">

        <a href="https://calendly.com/hey-remodelerrank/review-meeting-15-minutes" class="action primary">
          <span class="action-label">Schedule a Call &#8594;</span>
          <span class="action-sub">Book a 15-minute review</span>
        </a>

        <a href="../audit/" class="action">
          <span class="action-label">Request an Audit</span>
          <span class="action-sub">See where you're losing leads</span>
        </a>

        <a href="../" class="action">
          <span class="action-label">See Our Work</span>
          <span class="action-sub">Real projects, real results</span>
        </a>

        <a href="tel:7072086399" class="action call">
          <span class="action-label">Click to Call</span>
          <span class="action-sub">707-208-6399</span>
        </a>

      </div>

      <footer>
        <div class="footer-name">RemodelerRank</div>
        <a href="mailto:hey@remodelerrank.com">hey@remodelerrank.com</a>
      </footer>

    </div>

  </div>

</body>
</html>
